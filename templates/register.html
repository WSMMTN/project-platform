{% extends "base.html" %}
{% block title %}注册 - 项目展示平台{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>注册</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="stack">
    <label>用户名<input name="username" value="{{ username or '' }}" required autofocus></label>
    <label>密码<input type="password" name="password" required minlength="6"></label>
    <button type="submit">创建账号</button>
  </form>
  <p class="muted">已有账号？<a href="/login">登录</a></p>
</div>
{% endblock %}
