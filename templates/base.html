<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}项目展示平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  {% block nav %}
  <nav class="nav">
    <a class="brand" href="/projects">项目展示平台</a>
    <div class="nav-right">
      {% if user %}
        <span class="muted">{{ user.username }}</span>
        <a href="/logout">退出</a>
      {% else %}
        <a href="/login">登录</a>
        <a href="/register">注册</a>
      {% endif %}
    </div>
  </nav>
  {% endblock %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
