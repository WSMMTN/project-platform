# Render Blueprint：一次声明 Web Service + PostgreSQL，推送到 GitHub 后
# 在 Render 控制台 New -> Blueprint 即可一键部署。
services:
  - type: web
    name: project-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: project-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

databases:
  - name: project-platform-db
    plan: free
    databaseName: projectplatform
    user: app
